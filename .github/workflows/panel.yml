name: refresh profile system panel

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render panel
        run: python .github/scripts/panel.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit panel
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: refresh profile system panel"
          file_pattern: assets/panel.svg
