<svg width="820" height="430" viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101B26"/><stop offset="1" stop-color="#0B1420"/>
    </linearGradient>
    <clipPath id="c1"><rect x="24" y="70" height="18" width="0"><animate attributeName="width" from="0" to="90" begin="0.5s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="24" y="98" height="18" width="0"><animate attributeName="width" from="0" to="500" begin="1.7s" dur="1.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="24" y="126" height="18" width="0"><animate attributeName="width" from="0" to="170" begin="3.3s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="24" y="154" height="18" width="0"><animate attributeName="width" from="0" to="520" begin="4.3s" dur="1.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="24" y="182" height="18" width="0"><animate attributeName="width" from="0" to="470" begin="6.1s" dur="1.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="24" y="210" height="18" width="0"><animate attributeName="width" from="0" to="210" begin="7.9s" dur="0.7s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="820" height="430" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="817" height="427" rx="12.5" fill="none" stroke="#2C4257" stroke-width="2"/>
  <circle cx="26" cy="23" r="6" fill="#FF5F56"/><circle cx="46" cy="23" r="6" fill="#FFBD2E"/><circle cx="66" cy="23" r="6" fill="#27C93F"/>
  <text x="410" y="28" text-anchor="middle" fill="#5D7B93" font-size="13">ranveer@dev — zsh</text>
  <line x1="0" y1="44" x2="820" y2="44" stroke="#1D2F40"/>

  <g clip-path="url(#c1)"><text x="24" y="82" font-size="15"><tspan fill="#7EE787">$ </tspan><tspan fill="#E6EDF3">whoami</tspan></text></g>
  <g clip-path="url(#c2)"><text x="24" y="110" font-size="15" fill="#8BABC9">ranveer — ai builder · agent infra · systems</text></g>
  <g clip-path="url(#c3)"><text x="24" y="138" font-size="15"><tspan fill="#7EE787">$ </tspan><tspan fill="#E6EDF3">cat current.log</tspan></text></g>
  <g clip-path="url(#c4)"><text x="24" y="166" font-size="15" fill="#8BABC9">building: AgentBox — infrastructure for autonomous agents</text></g>
  <g clip-path="url(#c5)"><text x="24" y="194" font-size="15" fill="#8BABC9">research: StreamTransformer — push beyond VRAM limits</text></g>
  <g clip-path="url(#c6)"><text x="24" y="222" font-size="15"><tspan fill="#7EE787">$ </tspan><tspan fill="#E6EDF3">./deploy --profile</tspan></text></g>

  <g opacity="0"><set attributeName="opacity" to="1" begin="9.0s" dur="0.1s" fill="freeze"/>
    <text x="24" y="250" font-size="14" fill="#5D7B93">resolving curiosity</text>
    <rect x="250" y="239" width="200" height="13" rx="6.5" fill="#1B2C3B"/>
    <rect x="250" y="239" width="0" height="13" rx="6.5" fill="#567C8D"><animate attributeName="width" from="0" to="200" begin="9.0s" dur="0.8s" fill="freeze"/></rect>
    <text x="462" y="250" font-size="13" fill="#7EE787" opacity="0">100%<set attributeName="opacity" to="1" begin="9.8s" dur="0.1s" fill="freeze"/></text>
  </g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="9.4s" dur="0.1s" fill="freeze"/>
    <text x="24" y="278" font-size="14" fill="#5D7B93">compiling ideas</text>
    <rect x="250" y="267" width="200" height="13" rx="6.5" fill="#1B2C3B"/>
    <rect x="250" y="267" width="0" height="13" rx="6.5" fill="#79C0FF"><animate attributeName="width" from="0" to="200" begin="9.4s" dur="0.8s" fill="freeze"/></rect>
    <text x="462" y="278" font-size="13" fill="#7EE787" opacity="0">100%<set attributeName="opacity" to="1" begin="10.2s" dur="0.1s" fill="freeze"/></text>
  </g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="9.8s" dur="0.1s" fill="freeze"/>
    <text x="24" y="306" font-size="14" fill="#5D7B93">shipping projects</text>
    <rect x="250" y="295" width="200" height="13" rx="6.5" fill="#1B2C3B"/>
