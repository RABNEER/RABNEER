    <text x="462" y="306" font-size="13" fill="#7EE787" opacity="0">100%<set attributeName="opacity" to="1" begin="10.6s" dur="0.1s" fill="freeze"/></text>
  </g>

  <text x="24" y="334" font-size="15" fill="#7EE787" opacity="0">✓ systems online — welcome, visitor<set attributeName="opacity" to="1" begin="10.6s" dur="0.1s" fill="freeze"/></text>
  <text x="24" y="362" font-size="15" fill="#7EE787" opacity="0">$ <set attributeName="opacity" to="1" begin="10.6s" dur="0.1s" fill="freeze"/></text>
  <text x="40" y="362" font-size="15" fill="#7EE787" opacity="0">▊<set attributeName="opacity" to="1" begin="10.6s" dur="0.1s" fill="freeze"/><animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" begin="10.6s" dur="1.1s" repeatCount="indefinite"/></text>
  <text x="800" y="416" text-anchor="end" font-size="10" fill="#3A5468">reload to replay</text>
